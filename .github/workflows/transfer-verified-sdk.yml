name: Build comparison browser runtime
on:
  push:
    branches: [build/sdk-artifact-transfer-20261127]
    paths: ['.github/workflows/transfer-verified-sdk.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3b42a7e97da06339a8646d95ed44cc21106524ad
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Compile the original SDK and transfer the comparison bundle
        run: |
          test "$(git rev-parse HEAD)" = 3b42a7e97da06339a8646d95ed44cc21106524ad
          ./scripts/build-web.sh web/dist
          tar -czf "$RUNNER_TEMP/sdk.tar.gz" -C web/dist ganbate.js ganbate_web.wasm
          sha256sum "$RUNNER_TEMP/sdk.tar.gz" web/dist/{ganbate.js,ganbate_web.wasm}
          echo '::group::Unmodified baseline runtime'
          echo BEGIN_BASE_SDK_ARCHIVE
          base64 -w 512 "$RUNNER_TEMP/sdk.tar.gz"
          echo END_BASE_SDK_ARCHIVE
          echo '::endgroup::'
