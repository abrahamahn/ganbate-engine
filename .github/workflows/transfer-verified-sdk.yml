name: Transfer verified browser SDK
on:
  push:
    branches: [build/sdk-artifact-transfer-20261127]
    paths: ['.github/workflows/transfer-verified-sdk.yml']
permissions:
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Transfer CI archive after digest verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/abrahamahn/ganbate-engine/actions/artifacts/15174166605/zip > "$RUNNER_TEMP/sdk.zip"
          echo "2e35e453ad697b0efe98a2c31b9196615c8301319340c79db8f92370ad32fc7b  $RUNNER_TEMP/sdk.zip" | sha256sum -c -
          echo '::group::Verified archive'
          echo BEGIN_VERIFIED_SDK_ARCHIVE
          base64 -w 512 "$RUNNER_TEMP/sdk.zip"
          echo END_VERIFIED_SDK_ARCHIVE
          echo '::endgroup::'
