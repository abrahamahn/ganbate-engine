[package]
name = "ganbate-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Ganbate Studio's native 3D renderer"

[workspace]
members = [
    "crates/ganbate-assets",
    "crates/ganbate-audio",
    "crates/ganbate-core",
    "crates/ganbate-graph",
    "crates/ganbate-jobs",
    "crates/ganbate-physics",
    "crates/ganbate-pipeline",
    "crates/ganbate-scene",
    "crates/ganbate-seq",
    "crates/ganbate-shader",
    "crates/ganbate-vfx",
    "crates/ganbate-web",
]
resolver = "3"

[dependencies]
ganbate-core = { path = "crates/ganbate-core" }
ganbate-assets = { path = "crates/ganbate-assets" }
ganbate-jobs = { path = "crates/ganbate-jobs" }
ganbate-pipeline = { path = "crates/ganbate-pipeline" }
ganbate-scene = { path = "crates/ganbate-scene" }
ganbate-shader = { path = "crates/ganbate-shader" }
ganbate-physics = { path = "crates/ganbate-physics" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

