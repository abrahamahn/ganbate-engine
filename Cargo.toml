[package]
name = "ganbate-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Ganbate Studio's native 3D renderer"

[workspace]
members = [
    "crates/assets",
    "crates/audio",
    "crates/core",
    "crates/graph",
    "crates/jobs",
    "crates/physics",
    "crates/pipeline",
    "crates/scene",
    "crates/seq",
    "crates/shader",
    "crates/vfx",
    "crates/web",
]
resolver = "3"

[dependencies]
ganbate-core = { path = "crates/core" }
ganbate-assets = { path = "crates/assets" }
ganbate-jobs = { path = "crates/jobs" }
ganbate-pipeline = { path = "crates/pipeline" }
ganbate-scene = { path = "crates/scene" }
ganbate-shader = { path = "crates/shader" }
ganbate-physics = { path = "crates/physics" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

