[package]
name = "ganbate-web"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Ganbate's browser player: the stylized renderer in a canvas through WebGPU"

[lib]
# The module web/ganbate.js loads. Native builds compile to an empty library.
crate-type = ["cdylib"]

[dependencies]
ganbate-engine = { path = "../.." }
ganbate-graph = { path = "../ganbate-graph" }
ganbate-physics = { path = "../ganbate-physics" }
